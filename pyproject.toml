[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-risk-research"
version = "0.1.0"
description = "Offline close-interaction screening on Waymo motion data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.8", "protobuf>=6", "google-crc32c>=1.5", "joblib>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools>=1.70"]
demo = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
